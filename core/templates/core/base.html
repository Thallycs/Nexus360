{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus 360 Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #060810; --dark: #0c1120; --panel: #101828; --panel2: #141e30;
    --blue-bright: #38b6ff; --blue-mid: #1e7ec8; --blue-dark: #0f3460;
    --teal: #2dd4bf; --green: #22c55e; --orange: #f97316; --navy: #1a2744;
    --white: #f0f4ff; --muted: #8899bb; --border: rgba(56,182,255,0.15);
    --blue-bright-rgb: 56, 182, 255;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--white); font-family: 'Barlow', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-size: 40px 40px; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(56,182,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(56,182,255,0.04) 1px, transparent 1px); }
  body::after { content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%); width: 900px; height: 400px; background: radial-gradient(ellipse, rgba(56,182,255,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  
  /* HEADER */
  header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; background: rgba(12,17,32,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
  .logo-area { display: flex; align-items: center; gap: 16px; }
  .logo-icon { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 10px rgba(56, 182, 255, 0.3)); }
  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-text .brand { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; background: linear-gradient(90deg, var(--white), #e2e8f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo-text .brand span { font-size: 20px; vertical-align: super; color: var(--blue-bright); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; margin-left: 2px; }
  .logo-text .sub { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 24px; }
  .live-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
  .date-display { font-size: 12px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; }
  
  /* NAVIGATION */
  nav { position: relative; z-index: 5; display: flex; padding: 0 40px; border-bottom: 1px solid var(--border); margin-bottom: 24px; background: rgba(6, 8, 16, 0.5); }
  .nav-tab { padding: 16px 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .2s; text-decoration: none; }
  .nav-tab:hover { color: var(--white); }
  .nav-tab.active { color: var(--blue-bright); border-bottom-color: var(--blue-bright); background: linear-gradient(180deg, transparent, rgba(56, 182, 255, 0.05)); }
  
  /* TITLES & STRUCTURE */
  .title-bar { position: relative; z-index: 5; padding: 10px 40px 24px; display: flex; justify-content: space-between; align-items: flex-end; }
  .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 4px; line-height: 1; color: var(--white); text-transform: uppercase; }
  .page-title span { background: linear-gradient(90deg, var(--blue-bright), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .page-subtitle { font-size: 13px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif; margin-top: 6px; }
  
  .filter-bar { display: flex; gap: 8px; }
  .filter-btn { background: rgba(16, 24, 40, 0.6); border: 1px solid var(--border); padding: 6px 16px; border-radius: 4px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .filter-btn.active, .filter-btn:hover { border-color: var(--blue-bright); color: var(--white); background: rgba(56, 182, 255, 0.1); }

  /* KPI STRIP */
  .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 0 40px; margin-bottom: 24px; position: relative; z-index: 5; }
  .kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; position: relative; overflow: hidden; }
  .kpi-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .kpi-value { font-size: 36px; font-weight: 700; color: var(--white); margin: 6px 0; font-family: 'Barlow Condensed', sans-serif; }
  .kpi-delta { font-size: 11px; font-weight: 600; letter-spacing: 1px; }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--orange); }
  .kpi-bg-icon { position: absolute; right: 15px; bottom: 10px; font-size: 40px; opacity: 0.05; pointer-events: none; }
  
  .kpi-card.blue { border-left: 3px solid var(--blue-bright); }
  .kpi-card.green { border-left: 3px solid var(--green); }
  .kpi-card.orange { border-left: 3px solid var(--orange); }
  .kpi-card.navy { border-left: 3px solid var(--blue-dark); }

  /* MAIN GRIDS */
  .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; padding: 0 40px; margin-bottom: 24px; position: relative; z-index: 5; }
  .sidebar { display: flex; flex-direction: column; gap: 24px; }
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 0 40px; margin-bottom: 40px; position: relative; z-index: 5; }

  /* PANELS */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; position: relative; overflow: hidden; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .panel-title { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--blue-bright); display: flex; align-items: center; gap: 10px; }
  .panel-title::before { content: ''; width: 3px; height: 14px; background: linear-gradient(180deg, var(--blue-bright), var(--teal)); display: inline-block; }
  .panel-action { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .panel-action:hover { color: var(--blue-bright); }

  /* TABLES */
  .project-table { width: 100%; border-collapse: collapse; text-align: left; }
  .project-table th { padding: 10px 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  .project-table td { padding: 14px 12px; border-bottom: 1px solid rgba(56,182,255,0.05); vertical-align: middle; }
  .proj-name { font-size: 14px; font-weight: 500; color: var(--white); }
  .proj-client { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* BADGES */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase; background: rgba(254, 254, 254, 0.03); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  
  .badge.em-andamento { color: var(--blue-bright); background: rgba(56, 182, 255, 0.08); }
  .badge.em-andamento .badge-dot { background: var(--blue-bright); }
  .badge.concluido { color: var(--green); background: rgba(34, 197, 94, 0.08); }
  .badge.concluido .badge-dot { background: var(--green); }
  .badge.atencao { color: var(--orange); background: rgba(249, 115, 22, 0.08); }
  .badge.atencao .badge-dot { background: var(--orange); }
  .badge.pausado { color: var(--muted); background: rgba(136, 153, 187, 0.08); }
  .badge.pausado .badge-dot { background: var(--muted); }

  .priority { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
  .priority.alta { color: #f43f5e; }
  .priority.media { color: #eab308; }
  .priority.baixa { color: var(--muted); }

  /* PROGRESS */
  .progress-wrap { display: flex; align-items: center; gap: 10px; width: 120px; }
  .progress-bar { flex: 1; height: 4px; background: rgba(254,254,254,0.08); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; }
  .progress-fill.blue { background: var(--blue-bright); }
  .progress-fill.green { background: var(--green); }
  .progress-fill.orange { background: var(--orange); }
  .progress-fill.grey { background: var(--muted); }
  .progress-pct { font-size: 11px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; width: 28px; text-align: right; }
  .progress-pct.blue { color: var(--blue-bright); }
  .progress-pct.green { color: var(--green); }
  .progress-pct.orange { color: var(--orange); }
  .progress-pct.grey { color: var(--muted); }

  /* AVATARS */
  .avatar-group { display: flex; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 1px solid var(--panel); margin-left: -6px; color: #fff; }
  .avatar:first-child { margin-left: 0; }
  .avatar.a { background: #3b82f6; }
  .avatar.b { background: #10b981; }
  .avatar.c { background: #f59e0b; }
  .avatar.d { background: #8b5cf6; }

  /* DONUT CHART */
  .donut-wrap { position: relative; display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
  .donut-svg { width: 140px; height: 140px; transform: rotate(-90deg); }
  .donut-center { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .donut-center .big-num { font-size: 28px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; line-height: 1; }
  .donut-center .label { font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
  .donut-legend { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .legend-item { display: flex; justify-content: space-between; font-size: 12px; color: var(--white); }
  .legend-left { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }

  /* ALERTS & TIMELINE */
  .alerts-list { display: flex; flex-direction: column; gap: 12px; }
  .alert-item { background: rgba(254,254,254,0.02); border: 1px solid rgba(254,254,254,0.04); padding: 12px; border-radius: 6px; }
  .alert-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
  .alert-item.warn .alert-tag { color: var(--orange); }
  .alert-item.info .alert-tag { color: var(--blue-bright); }
  .alert-item.ok .alert-tag { color: var(--green); }
  .alert-text { font-size: 12px; color: var(--muted); line-height: 1.4; }

  .timeline-wrap { display: flex; flex-direction: column; gap: 16px; position: relative; padding-left: 20px; }
  .timeline-wrap::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 1px; background: var(--border); }
  .timeline-item { position: relative; }
  .tl-dot { position: absolute; left: -20px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); font-size: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 2; }
  .tl-dot.green { color: var(--green); border-color: var(--green); }
  .tl-dot.blue { color: var(--blue-bright); border-color: var(--blue-bright); }
  .tl-dot.orange { color: var(--orange); border-color: var(--orange); }
  .tl-title { font-size: 13px; font-weight: 500; color: var(--white); }
  .tl-meta { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: 'Barlow Condensed', sans-serif; }

  /* BAR CHART */
  .bar-chart { display: flex; flex-direction: column; gap: 14px; }
  .bar-row { display: flex; align-items: center; gap: 16px; }
  .bar-row-label { width: 120px; font-size: 12px; color: var(--muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .bar-outer { flex: 1; height: 6px; background: rgba(254,254,254,0.05); border-radius: 3px; overflow: hidden; }
  .bar-inner { height: 100%; border-radius: 3px; }
  .bar-val { width: 35px; font-size: 12px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; text-align: right; }

  .corner-deco { position: fixed; right: 0; bottom: 0; width: 300px; height: 300px; background: radial-gradient(ellipse at bottom right, rgba(249,115,22,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }

  /* ==============================================================================
     TRANSIÇÃO E EFEITOS DE RELEVO (HOVER)
     ============================================================================== */
  .nav-tab, .filter-btn, .kpi-card, .panel, .project-table tbody tr, .panel-action {
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                border-color 0.25s ease,
                background-color 0.25s ease;
  }

  /* Relevo nos Cards de KPI */
  .kpi-card:hover {
    transform: translateY(-4px);
  }
  .kpi-card.blue:hover {
    box-shadow: 0 8px 24px rgba(56, 182, 255, 0.18);
    border-color: rgba(56, 182, 255, 0.4);
  }
  .kpi-card.green:hover {
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.18);
    border-color: rgba(34, 197, 94, 0.4);
  }
  .kpi-card.orange:hover {
    box-shadow: 0 8px 24px rgba(249, 115, 22, 0.18);
    border-color: rgba(249, 115, 22, 0.4);
  }
  .kpi-card.navy:hover {
    box-shadow: 0 8px 24px rgba(30, 126, 200, 0.15);
    border-color: rgba(30, 126, 200, 0.4);
  }

  /* Relevo nos Painéis Principais */
  .panel:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(6, 8, 16, 0.8), 0 4px 12px rgba(56, 182, 255, 0.08);
    border-color: rgba(56, 182, 255, 0.25);
  }

  /* Realce suave nas linhas da tabela de projetos */
  .project-table tbody tr:hover {
    background: rgba(56, 182, 255, 0.03);
    cursor: pointer;
  }

  /* Botões de Filtro e Abas Superiores */
  .filter-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(56, 182, 255, 0.2);
  }
  .nav-tab:hover {
    background: linear-gradient(180deg, transparent, rgba(56, 182, 255, 0.03));
  }
</style>
</head>
<body>
<div class="corner-deco"></div>
<header>
  <div class="logo-area">
    <!-- ÍCONE ATUALIZADO: Código Vetorial SVG Exato e Robusto da image_110609.png -->
    <div class="logo-icon">
      <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="line-blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38b6ff"/>
            <stop offset="100%" stop-color="#1e7ec8"/>
          </linearGradient>
          <linearGradient id="line-green" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#22c55e"/>
          </linearGradient>
          <linearGradient id="center-orange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>
        </defs>

        <!-- As 3 linhas tecnológicas paralelas entrando pela esquerda -->
        <path d="M10,48 L35,48 L55,20 L75,50" stroke="url(#line-blue)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M10,55 L32,55 L50,30 L67,56" stroke="url(#line-green)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M10,62 L29,62 L45,40 L60,62" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Núcleo central tridimensional facetado -->
        <polygon points="55,48 65,48 60,40" fill="#ffedd5" opacity="0.9"/>
        <polygon points="55,48 65,48 60,56" fill="url(#center-orange)"/>
        <polygon points="65,48 75,54 67,56" fill="#1e2744" opacity="0.4"/>

        <!-- Estrutura geométrica que sobe para o lado direito criando o N -->
        <path d="M60,56 L78,82 L102,24" stroke="url(#line-blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M68,56 L83,76 L94,36" stroke="url(#center-orange)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Triângulos internos de reflexo azul/branco -->
        <polygon points="55,20 48,28 55,32" fill="#fff" opacity="0.3"/>
        <polygon points="78,82 72,72 82,70" fill="#38b6ff" opacity="0.4"/>

        <!-- Cabeça da Seta de Alta Performance Ascendente -->
        <polygon points="102,24 86,26 95,40" fill="#0f3460" stroke="url(#line-blue)" stroke-width="1.5"/>
      </svg>
    </div>
    
    <!-- Tipografia oficial com o 360 alinhado -->
    <div class="logo-text">
      <span class="brand">
        NEXUS <span>360</span>
      </span>
      <span class="sub">SOLUTIONS</span>
    </div>
  </div>
  
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div>Ao Vivo</div>
    <div class="date-display" id="datetime">—</div>
  </div>
</header>

<nav>
  <a href="{% url 'dashboard' %}" class="nav-tab {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Projetos</a>
  <a href="{% url 'equipes_page' %}" class="nav-tab {% if request.resolver_match.url_name == 'equipes_page' %}active{% endif %}">Equipes</a>
  <a href="{% url 'financas_page' %}" class="nav-tab {% if request.resolver_match.url_name == 'financas_page' %}active{% endif %}">Finanças</a>
  <a href="{% url 'relatorios_page' %}" class="nav-tab {% if request.resolver_match.url_name == 'relatorios_page' %}active{% endif %}">Relatórios</a>
  <a href="{% url 'settings_page' %}" class="nav-tab {% if request.resolver_match.url_name == 'settings_page' %}active{% endif %}">Configurações</a>
</nav>

{% block content %}
<!-- O conteúdo específico de cada página vai entrar aqui -->
{% endblock %}

<script>
  function updateTime() {
    const now = new Date();
    const opts = { weekday:'short', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
    document.getElementById('datetime').textContent = now.toLocaleString('pt-BR', opts);
  }
  updateTime(); setInterval(updateTime, 1000);
</script>
</body>
</html>
