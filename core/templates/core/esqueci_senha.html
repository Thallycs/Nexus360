<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus 360 — Recuperação de Senha</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #060810; --dark: #0c1120; --panel: #101828; --panel2: #141e30;
    --blue-bright: #38b6ff; --white: #f0f4ff; --muted: #8899bb; --border: rgba(56,182,255,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--white); font-family: 'Barlow', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  body::before { content: ''; position: fixed; inset: 0; background-size: 40px 40px; pointer-events: none; background-image: linear-gradient(rgba(56,182,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(56,182,255,0.04) 1px, transparent 1px); }
  .reset-container { position: relative; z-index: 5; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; padding: 40px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
  .reset-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--blue-bright), #2dd4bf); border-radius: 12px 12px 0 0; }
  h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; color: var(--blue-bright); }
  p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
  .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .form-group input { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; color: var(--white); font-size: 14px; }
  .btn-primary { background: linear-gradient(90deg, #1e7ec8, var(--blue-bright)); color: white; border: none; border-radius: 6px; padding: 14px; width: 100%; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
  .back-link { text-align: center; margin-top: 20px; font-size: 13px; font-family: 'Barlow Condensed', sans-serif; }
  .back-link a { color: var(--muted); text-decoration: none; }
  .back-link a:hover { color: var(--blue-bright); }
</style>
</head>
<body>

<div class="reset-container">
  <h2>Recuperar Senha</h2>
  <p>Insira o seu endereço de e-mail cadastrado abaixo. O sistema gerará e enviará um link seguro para a redefinição da sua credencial de acesso.</p>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_email">E-mail Cadastrado</label>
      <input type="email" name="email" id="id_email" autocomplete="email" required placeholder="exemplo@nexus.com">
    </div>
    <button type="submit" class="btn-primary">Enviar Link de Recuperação</button>
  </form>

  <div class="back-link">
    <a href="{% url 'login' %}">← Voltar para o Login</a>
  </div>
</div>

</body>
</html>
