{% extends 'core/base.html' %}

{% block content %}
<div style="padding: 20px; max-width: 600px; margin: 0 auto;">
    <h2 style="color: white; text-align: center;">Relatório Operacional - Status dos Projetos</h2>
    
    <canvas id="projectChart" width="400" height="400"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // Pegando os dados enviados pelo Python/Django e transformando em JavaScript
    const rawData = [
        {% for item in data %}
            { status: "{{ item.status }}", count: {{ item.count }} },
        {% endfor %}
    ];

    const labels = rawData.map(item => item.status);
    const counts = rawData.map(item => item.count);

    // Renderizando o Gráfico Relacional
    const ctx = document.getElementById('projectChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar', // Gráfico de barras (pode mudar para 'pie' se quiser gráfico de pizza)
        data: {
            labels: labels,
            datasets: [{
                label: 'Quantidade de Projetos',
                data: counts,
                backgroundColor: '#007bff', // Azul solicitado na identidade visual
                borderColor: '#ffffff',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
