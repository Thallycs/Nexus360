<script>
  let projetos = [
    { id: 1, title: 'Sistema ERP Industrial', client: 'Metalúrgica Fortex', desc: 'Implantação completa do ERP com módulos de produção e estoque.', status: 'DESENVOLVIMENTO', progress: 72, priority: 'Alta', owner: 'RM' },
    { id: 2, title: 'Portal Logístico B2B', client: 'Grupo TransLog', desc: 'Portal de pedidos e rastreamento para clientes B2B.', status: 'ENTREGUE', progress: 100, priority: 'Média', owner: 'AN' },
    { id: 3, title: 'Automação de Relatórios', client: 'Banco Meridian', desc: 'Pipeline de geração automática de relatórios regulatórios.', status: 'TESTES', progress: 38, priority: 'Alta', owner: 'PS' }
  ];
  
  let editandoId = null;

  function iniciarDashboard() {
    renderizarTabela(projetos);
    atualizarKpis(projetos);
  }

  function renderizarTabela(lista) {
    const tbody = document.getElementById('corpo-tabela-projetos');
    if (lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--muted);">NENHUM PROJETO ENCONTRADO.</td></tr>`;
      return;
    }

    tbody.innerHTML = lista.map(p => {
      let badgeCls = p.status === 'ENTREGUE' ? 'verde' : p.status === 'PAUSADO' ? 'cinza' : p.status === 'TESTES' ? 'laranja' : 'azul';
      let labelStatus = p.status.charAt(0) + p.status.slice(1).toLowerCase();
      
      return `
        <tr>
          <td>
            <div class="proj-name">${p.title}</div>
            <div class="proj-client">Cliente: ${p.client || 'Nexus Interno'}</div>
            <!-- LINHA DE DESCRIÇÃO COMPORTADA LOGO ABAIXO DO NOME -->
            <div style="font-size: 11px; color: var(--muted); margin-top: 4px; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.desc || 'Sem descrição.'}">
              ${p.desc || '<i>Sem descrição cadastrada.</i>'}
            </div>
          </td>
          <td><span class="badge ${badgeCls}"><span class="badge-dot"></span>${labelStatus}</span></td>
          <td>
            <div class="progress-wrap">
              <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%"></div></div>
              <span class="progress-pct blue">${p.progress}%</span>
            </div>
          </td>
          <td><span class="priority ${p.priority === 'Alta' ? 'alta' : p.priority === 'Média' ? 'media' : 'baixa'}">${p.priority}</span></td>
          <td><div class="avatar-group"><div class="avatar a" style="background:#1e7ec8">${p.owner}</div></div></td>
          <td>
            <div class="action-cell">
              <button class="btn-icon" onclick="abrirEdicao(${p.id})">✏️</button>
              <button class="btn-icon del" onclick="deletarProjeto(${p.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function atualizarKpis(lista) {
    const total = lista.length;
    const ativos = lista.filter(p => p.status === 'DESENVOLVIMENTO' || p.status === 'TESTES' || p.status === 'PLANEJAMENTO').length;
    const entregues = lista.filter(p => p.status === 'ENTREGUE').length;
    const somaProgresso = lista.reduce((acc, p) => acc + Number(p.progress), 0);
    const media = total > 0 ? Math.round(somaProgresso / total) : 0;

    document.getElementById('kpi-total').textContent = total;
    document.getElementById('kpi-ativos').textContent = ativos;
    document.getElementById('kpi-entregues').textContent = entregues;
    document.getElementById('kpi-media').textContent = media + '%';
    document.getElementById('donut-total').textContent = total;

    const circle = document.getElementById('donut-segment-main');
    if(circle) {
      const c = 2 * Math.PI * 60;
      const pctAtivos = total > 0 ? (ativos / total) : 0;
      const dashArrayVal = pctAtivos * c;
      circle.setAttribute('stroke-dasharray', `${dashArrayVal} ${c}`);
    }

    const legend = document.getElementById('donut-legend-list');
    legend.innerHTML = `
      <div class="legend-item"><div class="legend-left"><div class="legend-dot" style="background:var(--blue-bright)"></div>Ativos</div><div class="legend-val">${ativos}</div></div>
      <div class="legend-item"><div class="legend-left"><div class="legend-dot" style="background:var(--green)"></div>Entregues</div><div class="legend-val">${entregues}</div></div>
    `;
  }

  function filtrarTabela() {
    const busca = document.getElementById('proj-search').value.toLowerCase();
    const fStatus = document.getElementById('proj-filter-status').value;
    const fPriority = document.getElementById('proj-filter-priority').value;

    let filtrados = projetos.filter(p => {
      const matchBusca = p.title.toLowerCase().includes(busca) || p.client.toLowerCase().includes(busca) || (p.desc && p.desc.toLowerCase().includes(busca));
      const matchStatus = fStatus === "" || p.status === fStatus;
      const matchPriority = fPriority === "" || p.priority === fPriority;
      return matchBusca && matchStatus && matchPriority;
    });

    renderizarTabela(filtrados);
  }

  function abrirCriacao() {
    editandoId = null;
    document.getElementById('proj-modal-title').textContent = 'Novo Projeto';
    document.getElementById('pf-title').value = '';
    document.getElementById('pf-client').value = '';
    document.getElementById('pf-desc').value = ''; // Limpa a descrição
    document.getElementById('pf-status').value = 'PLANEJAMENTO';
    document.getElementById('pf-priority').value = 'Alta';
    document.getElementById('pf-progress').value = 0;
    document.getElementById('pf-owner').value = '';
    openModal();
  }

  function abrirEdicao(id) {
    const p = projetos.find(x => x.id === id);
    if(!p) return;
    editandoId = id;
    document.getElementById('proj-modal-title').textContent = 'Editar Projeto';
    document.getElementById('pf-title').value = p.title;
    document.getElementById('pf-client').value = p.client;
    document.getElementById('pf-desc').value = p.desc || ''; // Carrega a descrição para edição
    document.getElementById('pf-status').value = p.status;
    document.getElementById('pf-priority').value = p.priority;
    document.getElementById('pf-progress').value = p.progress;
    document.getElementById('pf-owner').value = p.owner;
    openModal();
  }

  function salvarProjetoDoModal() {
    const title = document.getElementById('pf-title').value.trim();
    if(!title) return;

    const dados = {
      title: title,
      client: document.getElementById('pf-client').value.trim(),
      desc: document.getElementById('pf-desc').value.trim(), // Captura a descrição salva
      status: document.getElementById('pf-status').value,
      priority: document.getElementById('pf-priority').value,
      progress: Number(document.getElementById('pf-progress').value) || 0,
      owner: document.getElementById('pf-owner').value.trim().toUpperCase() || 'NX'
    };

    if (editandoId !== null) {
      let idx = projetos.findIndex(x => x.id === editandoId);
      projetos[idx] = { id: editandoId, ...dados };
    } else {
      let novoId = projetos.length > 0 ? Math.max(...projetos.map(x=>x.id)) + 1 : 1;
      projetos.push({ id: novoId, ...dados });
    }

    closeModal();
    iniciarDashboard();
  }

  function deletarProjeto(id) {
    projetos = projetos.filter(x => x.id !== id);
    iniciarDashboard();
  }

  function filtrarTempo(tipo) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  document.addEventListener("DOMContentLoaded", iniciarDashboard);
</script>
