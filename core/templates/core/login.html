{% extends 'core/base.html' %}
{% load static %}
{% block content %}

<style>
  /* Sobrescreve o container para centralizar o card perfeitamente na tela de login */
  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    position: relative;
    z-index: 5;
    padding: 20px;
  }
  
  .auth-card {
    background: #101828;
    border: 1px solid rgba(56, 182, 255, 0.15);
    padding: 40px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 40px rgba(6, 8, 16, 0.6);
  }

  .auth-input-group {
    text-align: left;
    margin-bottom: 20px;
  }

  .auth-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: #8899bb;
    text-transform: uppercase;
    letter-spacing: 2px;
    display: block;
    margin-bottom: 6px;
  }

  .auth-input {
    width: 100%;
    background: #0c1120;
    border: 1px solid rgba(56, 182, 255, 0.15);
    padding: 14px;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    font-family: 'Barlow', sans-serif;
    transition: all 0.2s;
  }

  .auth-input:focus {
    border-color: #38b6ff;
    box-shadow: 0 0 10px rgba(56, 182, 255, 0.1);
    outline: none;
  }

  .auth-btn {
    width: 100%;
    background: #38b6ff;
    border: none;
    padding: 14px;
    border-radius: 6px;
    color: #060810;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
  }

  .auth-btn:hover {
    background: #2dd4bf;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56, 182, 255, 0.2);
  }

  .auth-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    font-size: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
  }

  .auth-link {
    color: #8899bb;
    text-decoration: none;
    transition: color 0.2s;
  }

  .auth-link:hover {
    color: #38b6ff;
  }

  .auth-alert {
    background: rgba(244, 63, 94, 0.1);
    border-left: 3px solid #f43f5e;
    padding: 12px;
    font-size: 13px;
    color: #f43f5e;
    margin-bottom: 20px;
    border-radius: 4px;
    text-align: left;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    
    <!-- ==============================================================================
         LOGOTIPO TRIDIMENSIONAL OFICIAL (Fiel à edited-image_2.png)
         ============================================================================== -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 28px;">
      <div style="width: 100px; height: 100px; filter: drop-shadow(0 0 15px rgba(56, 182, 255, 0.35));">
        <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="auth-blue" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38b6ff"/>
              <stop offset="100%" stop-color="#1e7ec8"/>
            </linearGradient>
            <linearGradient id="auth-green" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2dd4bf"/>
              <stop offset="100%" stop-color="#22c55e"/>
            </linearGradient>
            <linearGradient id="auth-orange" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#ea580c"/>
            </linearGradient>
          </defs>

          <!-- As 3 linhas paralelas entrando pela esquerda (edited-image_2.png) -->
          <path d="M10,48 L35,48 L55,20 L75,50" stroke="url(#auth-blue)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M10,55 L32,55 L50,30 L67,56" stroke="url(#auth-green)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M10,62 L29,62 L45,40 L60,62" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- Centro facetado -->
          <polygon points="55,48 65,48 60,40" fill="#ffedd5" opacity="0.9"/>
          <polygon points="55,48 65,48 60,56" fill="url(#auth-orange)"/>
          <polygon points="65,48 75,54 67,56" fill="#1e2744" opacity="0.4"/>

          <!-- Subida lateral formando o N -->
          <path d="M60,56 L78,82 L102,24" stroke="url(#auth-blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M68,56 L83,76 L94,36" stroke="url(#auth-orange)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- Brilhos internos -->
          <polygon points="55,20 48,28 55,32" fill="#fff" opacity="0.3"/>
          <polygon points="78,82 72,72 82,70" fill="#38b6ff" opacity="0.4"/>

          <!-- Seta superior de alta performance -->
          <polygon points="102,24 86,26 95,40" fill="#0f3460" stroke="url(#auth-blue)" stroke-width="1.5"/>
        </svg>
      </div>
      
      <h1 style="font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; margin-top: 14px; color: #ffffff; text-align: center; line-height: 1;">
        NEXUS <span style="font-size: 22px; vertical-align: super; color: #38b6ff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700;">360</span>
      </h1>
      <p style="font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 4px; color: #8899bb; text-transform: uppercase; margin-top: 6px; text-align: center;">
        SOLUTIONS
      </p>
    </div>

    <!-- MENSAGENS DE ERRO DO DJANGO -->
    {% if form.errors or messages %}
      <div class="auth-alert">
        E-mail ou senha incorretos. Por favor, tente novamente.
      </div>
    {% endif %}

    <!-- FORMULÁRIO DE LOGIN -->
    <form method="POST">
      {% csrf_token %}
      <div class="auth-input-group">
        <label class="auth-label">E-mail</label>
        <input type="email" name="username" class="auth-input" required placeholder="exemplo@nexus.com" autofocus>
      </div>
      
      <div class="auth-input-group">
        <label class="auth-label">Senha</label>
        <input type="password" name="password" class="auth-input" required placeholder="••••••••">
      </div>

      <button type="submit" class="auth-btn">Acessar Plataforma</button>
    </form>

    <!-- LINKS ÚTEIS -->
    <div class="auth-footer">
      <a href="{% url 'cadastro' %}" class="auth-link">Novo Usuário</a>
      <a href="{% url 'password_reset' %}" class="auth-link">Esqueci minha senha</a>
    </div>

  </div>
</div>

{% endblock %}
