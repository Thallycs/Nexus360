<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus 360 Solutions — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #060810; --dark: #0c1120; --panel: #101828; --panel2: #141e30;
    --blue-bright: #38b6ff; --teal: #2dd4bf; --orange: #f97316;
    --white: #f0f4ff; --muted: #8899bb; --border: rgba(56,182,255,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black); color: var(--white); font-family: 'Barlow', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; background-size: 40px 40px; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(56,182,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(56,182,255,0.04) 1px, transparent 1px);
  }
  .login-container {
    position: relative; z-index: 5; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; width: 100%; max-width: 420px; padding: 40px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  }
  .logo-wrapper {
    text-align: center; margin-bottom: 24px; display: flex; flex-direction: column; align-items: center;
  }
  /* Recriação do estilo icônico do vetor da logo */
  .logo-icon-svg { width: 120px; height: auto; margin-bottom: 12px; }
  .logo-brand { font-size: 32px; font-weight: 700; letter-spacing: 4px; color: var(--white); }
  .logo-sub { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  
  .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .form-group input {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; color: var(--white); font-size: 14px; transition: all 0.2s;
  }
  .form-group input:focus { outline: none; border-color: var(--blue-bright); box-shadow: 0 0 8px rgba(56,182,255,0.2); }
  
  .btn-primary {
    background: linear-gradient(90deg, var(--blue-mid, #1e7ec8), var(--blue-bright));
    color: white; border: none; border-radius: 6px; padding: 14px; width: 100%;
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.9; }
  
  .auth-links { display: flex; justify-content: space-between; margin-top: 24px; font-size: 12px; font-family: 'Barlow Condensed', sans-serif; }
  .auth-links a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .auth-links a:hover { color: var(--blue-bright); }
  
  .error-message { background: rgba(239, 68, 68, 0.1); border-left: 3px solid #ef4444; color: #f87171; padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="login-container">
  <div class="logo-wrapper">
    <!-- Renderização geométrica simplificada via SVG inspirada na Logo Oficial da imagem_03e2ca.png -->
    <svg class="logo-icon-svg" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 45 L35 15 L55 35 L75 10 L90 10" stroke="#38b6ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 45 L30 25 L50 45 L70 20" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M55 35 L65 23 L75 33 L65 43 Z" fill="#f97316" opacity="0.85"/>
      <path d="M75 10 L88 10 L82 22 Z" fill="#38b6ff"/>
    </svg>
    <div class="logo-brand">NEXUS 360</div>
    <div class="logo-sub">Solutions</div>
  </div>

  {% if form.errors %}
    <div class="error-message">E-mail ou senha incorretos. Por favor, tente novamente.</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">E-mail</label>
      <input type="email" name="username" id="id_username" autocomplete="email" required placeholder="exemplo@nexus.com">
    </div>
    
    <div class="form-group">
      <label for="id_password">Senha</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-primary">Acessar Plataforma</button>
  </form>

  <div class="auth-links">
    <a href="{% url 'cadastro' %}">Novo Usuário</a>
    <a href="{% url 'password_reset' %}">Esqueci minha senha</a>
  </div>
</div>

</body>
</html>
