<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Senha - Nexus 360</title>
    <style>
        body { background-color: #0b132b; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background-color: #1c2541; padding: 30px; display: inline-block; border-radius: 8px; text-align: left; }
        input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; }
        button { background-color: #00b4d8; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Definir Nova Senha</h2>
        <p>Digite sua nova senha de acesso abaixo:</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Alterar Senha</button>
        </form>
    </div>
</body>
</html>
