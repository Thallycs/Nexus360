{% extends 'core/base.html' %}

{% block content %}
<div class="title-bar">
  <div>
    <div class="page-title">Painel de <span>Configurações</span></div>
    <div class="page-subtitle">Parâmetros Globais da Plataforma Nexus 360</div>
  </div>
</div>

<div class="panel">
  <div class="panel-header"><div class="panel-title">Preferências do Sistema</div></div>
  <div style="display:flex; flex-direction:column; gap:16px;">
    <label style="display:flex; align-items:center; gap:12px; cursor:pointer;">
      <input type="checkbox" checked style="accent-color:var(--blue-bright);"> Modo Noturno Neon Habilitado
    </label>
    <label style="display:flex; align-items:center; gap:12px; cursor:pointer;">
      <input type="checkbox" checked style="accent-color:var(--blue-bright);"> Atualização em Tempo Real (WebSockets)
    </label>
  </div>
</div>
{% endblock %}
