{% extends 'core/base.html' %}

{% block content %}
<div style="padding: 30px; max-width: 500px; margin: 0 auto; background-color: #0a192f; border-radius: 8px; color: white;">
    <h2>Painel de Gestão e Configurações</h2>
    <p style="color: #cccccc;">Área Restrita para Administradores</p>
    <hr style="border-color: #007bff;">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Nome do Portal:</label>
            <input type="text" name="site_name" value="{{ config.site_name }}" style="width: 100%; padding: 8px; background: #000; color: #fff; border: 1px solid #007bff;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Alterar Logotipo:</label>
            <input type="file" name="logo" style="color: white;">
            {% if config.logo %}
                <p style="font-size: 12px; color: #007bff;">Atual: {{ config.logo.name }}</p>
            {% endif %}
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Alterar Favicon (.ico/.png):</label>
            <input type="file" name="favicon" style="color: white;">
        </div>

        <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%; font-weight: bold;">
            Salvar Configurações
        </button>
    </form>
</div>
{% endblock %}
